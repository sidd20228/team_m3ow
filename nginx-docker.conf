# Nginx configuration for Docker environment
# This version is optimized for containerized deployment

# --- Process and Logging ---
worker_processes 1;
error_log /usr/local/openresty/nginx/logs/error.log info;
pid /usr/local/openresty/nginx/logs/nginx.pid;

# --- Connection Handling ---
events {
    worker_connections 1024;
}

# --- HTTP Server Definitions ---
http {
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # Access logs
    access_log /usr/local/openresty/nginx/logs/access.log;

    # Upstream for FastAPI WAF application (Docker service name)
    upstream waf_backend {
        server waf_app:8001;
    }

    # HTTP server that receives traffic
    server {
        listen 80;
        server_name _;

        location / {
            # --- WAF Lua script (enabled) ---
            access_by_lua_file /usr/local/openresty/nginx/lua/waf_chain.lua;

            # Proxy to FastAPI application
            proxy_pass http://waf_backend;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check endpoint
        location /health {
            access_log off;
            proxy_pass http://waf_backend;
        }
    }
}
